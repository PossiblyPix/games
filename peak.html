
<!doctype html>
<html>
    <head>
        <title>PossiblyPix</title>
        <link rel="stylesheet" href="https://possiblypix.github.io/style.css">
        <style>
            .centered-text {
                height: auto;
                margin: 0 0 0.5rem;
            }
        </style>
    </head>
    <body>
        <div class="hovershadow">
        <nav class="top-nav">
            <a href="https://possiblypix.github.io" class="nav-btn">Home</a>
            <a href="https://possiblypix.github.io/games" class="nav-btn">Games</a>
            <a href="about:blank" class="nav-btn" onclick="cloakPage(event)">Cloak</a>
        </nav>
        </div>
        <h1 class="centered-text">PEAK</h1>
        <div class="game-container" style="display: flex; flex-direction: column; align-items: center; margin: 0 auto;">
            <iframe
                id="deltarune-game"
                src="https://possiblypix.github.io/gameing/iframe/847.html?cdn=https%3A%2F%2Fcdn.jsdelivr.net%2Fgh%2Fwasmdotrip%2FPeak-Port%40main/"
                title="PEAK"
                allowfullscreen
                style="display: block; width: 1000px; max-width: 100%; height: 750px; aspect-ratio: 4 / 3;">
            </iframe>
            <button type="button" id="fullscreen-button" class="nav-btn">Fullscreen</button>
        </div>
        <script>
            const game = document.getElementById('deltarune-game');
            const fullscreenButton = document.getElementById('fullscreen-button');

            fullscreenButton.addEventListener('click', () => {
                if (game.requestFullscreen) {
                    game.requestFullscreen();
                } else if (game.webkitRequestFullscreen) {
                    game.webkitRequestFullscreen();
                }
            });
        </script>
    </body>
</html>
