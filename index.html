<!doctype html>
<html>
    <head>
        <title>Games</title>
        <link rel="stylesheet" href="https://possiblypix.github.io/style.css">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="https://possiblypix.github.io/favicon.png">
    </head>
    <body>
        <div class="hovershadow">
        <nav class="top-nav">
            <a href="https://possiblypix.github.io" class="nav-btn">Home</a>
            <a href="https://possiblypix.github.io/games" class="nav-btn">Games</a>
            <a href="https://possiblypix.github.io/contact" class="nav-btn">Contact</a>
            <a href="https://possiblypix.github.io/legal" class="nav-btn">Legal</a>
            <a href="about:blank" class="nav-btn" onclick="cloakPage(event)">Cloak</a>
        </nav>
        </div>
        <main class="games-page">
            <header class="library-heading">
                <div>
                    <p class="library-kicker">PossiblyPix / games</p>
                    <h1 class="page-title">Games</h1>
                    <p class="library-description">gaming!!</p>
                </div>
                <label class="search-box">
                    <span>Search games</span>
                    <input id="game-search" type="search" placeholder="Try Celeste or FNAF" autocomplete="off">
                </label>
            </header>
            <p class="game-count" id="game-count" aria-live="polite"></p>
            <section class="game-grid" id="game-grid" aria-label="Games"></section>
            <p class="empty-state" id="empty-state" hidden>No games match that search.</p>
        </main>
        <script src="script.js">
        </script>
    </body>
</html>
